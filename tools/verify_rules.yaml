# 登録しない文書：dglobal/TECHNIUM_Day1_面談準備_20260902.md
# 社内限であり対外成果物ではない。かつ「言ってはいけない語」の一覧そのものを本文に
# 列挙する性質上、禁止語照合が構造的に偽陽性になる（14件）。同種の規律メモは登録しない。

# 送付前検証のルール
#
# forbidden : 残存してはならない語。1件でも出れば不合格。
# required  : 是正の維持。欠落すれば不合格。
# numbers   : 数値。--recompute で算式を再計算し、単位語込みの原文で照合する（原則2）。
#
# allow_in  : 正当な例外を認める区画ラベル（部分一致）。
#             例：§13 出典の「執行計画書 第1.5版」は別文書の版であり正当。

