<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="990" viewBox="0 0 1400 990" font-family="IPAPGothic, IPAGothic, 'Noto Sans CJK JP', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5402a"/></marker>
  </defs>
  <rect width="1400" height="990" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="46" font-size="26" font-weight="bold" fill="#111">側流・固定床・封じ込め ── 本線を止めず、I₂ の色を外に出さない側流回収ユニット（設計案・協議用）</text>
  <text x="40" y="74" font-size="14" fill="#444">PhaseShift Technologies（設立準備中）｜2026/09/02 作成｜貴社 9/1 ご指摘（取り損ね不可・I₂ の色・粉末吸着剤のロス・大流量）への設計上の回答。数値は当社設計基準値であり、貴社実流量への当てはめは〔要確認〕欄で行います。</text>

  <!-- ===== main line ===== -->
  <text x="40" y="118" font-size="16" font-weight="bold" fill="#1f5fa8">① 本線（貴社既存工程）── 一切触らない・止めない</text>
  <rect x="40" y="130" width="130" height="60" rx="6" fill="#e8eef7" stroke="#1f5fa8" stroke-width="2"/>
  <text x="105" y="155" font-size="14" text-anchor="middle" fill="#111">井戸（複数）</text>
  <text x="105" y="175" font-size="12" text-anchor="middle" fill="#555">流量変動あり</text>
  <line x1="170" y1="160" x2="220" y2="160" stroke="#1f5fa8" stroke-width="6" marker-end="url(#arrB)"/>
  <rect x="222" y="130" width="150" height="60" rx="6" fill="#e8eef7" stroke="#1f5fa8" stroke-width="2"/>
  <text x="297" y="155" font-size="14" text-anchor="middle" fill="#111">かん水集積槽</text>
  <text x="297" y="175" font-size="12" text-anchor="middle" fill="#555">連続運転・滞留</text>
  <line x1="372" y1="160" x2="422" y2="160" stroke="#1f5fa8" stroke-width="6" marker-end="url(#arrB)"/>
  <rect x="424" y="130" width="150" height="60" rx="6" fill="#e8eef7" stroke="#1f5fa8" stroke-width="2"/>
  <text x="499" y="155" font-size="14" text-anchor="middle" fill="#111">放散塔（ブローアウト）</text>
  <text x="499" y="175" font-size="12" text-anchor="middle" fill="#555">→ 吸収工程（既存）</text>
  <line x1="574" y1="160" x2="1010" y2="160" stroke="#1f5fa8" stroke-width="6"/>
  <text x="790" y="150" font-size="13" text-anchor="middle" fill="#1f5fa8">放散塔後 排水ライン（場外へ出るのはこの 1 本）</text>
  <line x1="1010" y1="160" x2="1180" y2="160" stroke="#1f5fa8" stroke-width="6" marker-end="url(#arrB)"/>
  <rect x="1184" y="130" width="176" height="60" rx="6" fill="#fff4e5" stroke="#d98a1f" stroke-width="2"/>
  <text x="1272" y="155" font-size="14" text-anchor="middle" fill="#111">放流先〔要確認〕</text>
  <text x="1272" y="175" font-size="12" text-anchor="middle" fill="#7a4e00">海域放流か 還元井か</text>

  <!-- branch / return points -->
  <circle cx="700" cy="160" r="7" fill="#b5402a"/>
  <text x="700" y="210" font-size="13" text-anchor="middle" fill="#b5402a">分岐点（側流 3.5〜6.8%）</text>
  <circle cx="1010" cy="160" r="7" fill="#1a8a4a"/>
  <text x="1010" y="210" font-size="13" text-anchor="middle" fill="#1a8a4a">返送点（処理水を本線へ戻す）</text>

  <!-- branch down -->
  <line x1="700" y1="167" x2="700" y2="300" stroke="#b5402a" stroke-width="4" marker-end="url(#arrR)"/>
  <text x="712" y="250" font-size="12" fill="#b5402a">側流ポンプ（本線圧に依存しない）</text>
  <text x="712" y="268" font-size="12" fill="#b5402a">設計基準 2,074 m³/日</text>
  <!-- return up -->
  <line x1="1010" y1="300" x2="1010" y2="167" stroke="#1a8a4a" stroke-width="4" marker-end="url(#arrB)"/>
  <text x="1022" y="250" font-size="12" fill="#1a8a4a">処理水（ポリマー流出 ≦ 0.1 wt% を監視）</text>
  <text x="1022" y="268" font-size="12" fill="#1a8a4a">逸脱時は自動バイパスで本線へ影響なし</text>

  <!-- ===== side-stream unit box ===== -->
  <rect x="330" y="300" width="760" height="330" rx="10" fill="#f7f7f7" stroke="#333" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="345" y="326" font-size="16" font-weight="bold" fill="#111">② 側流ユニット（コンテナ型・2 m × 4 m 級・スキッド後付け）── 圧力損失 ΔP ≦ 50 kPa を設計目標</text>

  <!-- pretreatment -->
  <rect x="350" y="350" width="150" height="90" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="425" y="378" font-size="14" text-anchor="middle" fill="#111">前処理</text>
  <text x="425" y="398" font-size="12" text-anchor="middle" fill="#555">ろ過（SS 除去）</text>
  <text x="425" y="416" font-size="12" text-anchor="middle" fill="#7a4e00">形態調整〔要確認〕</text>
  <text x="425" y="432" font-size="10" text-anchor="middle" fill="#7a4e00">還元剤残留→酸化前処理</text>
  <line x1="500" y1="395" x2="545" y2="395" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>

  <!-- fixed bed cartridges -->
  <rect x="548" y="340" width="300" height="110" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="698" y="362" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">固定床カートリッジ ×2（交互運転）</text>
  <rect x="565" y="372" width="120" height="66" rx="4" fill="#e6f2ea" stroke="#1a8a4a" stroke-width="1.5"/>
  <text x="625" y="395" font-size="12" text-anchor="middle" fill="#111">A：捕捉中（通水）</text>
  <text x="625" y="413" font-size="11" text-anchor="middle" fill="#555">温度応答性ポリマー</text>
  <text x="625" y="429" font-size="11" text-anchor="middle" fill="#555">を容器内に固定</text>
  <rect x="711" y="372" width="120" height="66" rx="4" fill="#fdecea" stroke="#b5402a" stroke-width="1.5"/>
  <text x="771" y="395" font-size="12" text-anchor="middle" fill="#111">B：再生中（約 40℃）</text>
  <text x="771" y="413" font-size="11" text-anchor="middle" fill="#555">通水を止めて放出</text>
  <text x="771" y="429" font-size="11" text-anchor="middle" fill="#555">粉末・懸濁は使わない</text>
  <line x1="848" y1="395" x2="900" y2="395" stroke="#333" stroke-width="3" marker-end="url(#arr)"/>

  <!-- outlet guard -->
  <rect x="902" y="350" width="170" height="90" rx="6" fill="#ffffff" stroke="#1a8a4a" stroke-width="1.5"/>
  <text x="987" y="378" font-size="14" text-anchor="middle" fill="#111">出口ガード</text>
  <text x="987" y="398" font-size="12" text-anchor="middle" fill="#555">保護フィルタ＋濁度・UV 監視</text>
  <text x="987" y="416" font-size="12" text-anchor="middle" fill="#1a8a4a">ポリマー流出 ≦ 0.1 wt%</text>
  <text x="987" y="432" font-size="11" text-anchor="middle" fill="#555">逸脱→自動バイパス・警報</text>
  <line x1="1010" y1="350" x2="1010" y2="302" stroke="#1a8a4a" stroke-width="3"/>

  <!-- regeneration path -->
  <line x1="771" y1="438" x2="771" y2="480" stroke="#b5402a" stroke-width="3" marker-end="url(#arrR)"/>
  <rect x="560" y="484" width="420" height="120" rx="6" fill="#ffffff" stroke="#b5402a" stroke-width="1.5"/>
  <text x="770" y="508" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">③ 再生・濃縮（密閉系）── I₂ の色を排水側に出さない</text>
  <text x="770" y="530" font-size="12" text-anchor="middle" fill="#555">約 40℃ の低品位廃熱の活用を設計目標（熱源〔要確認〕）。濃縮相＝全流量の約 1〜3% のみ局所加温（所要 約 10.5 kW 見込み）</text>
  <text x="770" y="550" font-size="12" text-anchor="middle" fill="#555">放出されたヨウ素は濃縮相として密閉容器へ。処理水側（本線へ戻る水）とは物理的に分離</text>
  <text x="770" y="572" font-size="13" text-anchor="middle" fill="#b5402a">濃縮液の行き先（案）：貴社の既存吸収工程（重亜硫酸ソーダ系）へ密閉配管で戻す ＝ 貴社の製品ラインに合流〔要協議〕</text>
  <text x="770" y="592" font-size="12" text-anchor="middle" fill="#555">代替：密閉容器で搬出（貴社の製品規格に合わせた形態は別途協議）</text>

  <!-- ===== three barriers ===== -->
  <text x="40" y="670" font-size="16" font-weight="bold" fill="#111">④ 「取り損ね」「色」「吸着剤ロス」への 3 つの封じ込め（設計要件として明文化）</text>
  <rect x="40" y="684" width="420" height="120" rx="8" fill="#e6f2ea" stroke="#1a8a4a" stroke-width="1.5"/>
  <text x="60" y="710" font-size="14" font-weight="bold" fill="#111">封じ込め 1：吸着剤は容器から出ない</text>
  <text x="60" y="734" font-size="12" fill="#333">粉末・懸濁の吸着剤は使わない。固定床カートリッジ内に</text>
  <text x="60" y="752" font-size="12" fill="#333">固定し、出口に保護フィルタ。流出率 ≦ 0.1 wt% を</text>
  <text x="60" y="770" font-size="12" fill="#333">当社の合否軸（第⑤軸）に置き、超えたら不合格。</text>
  <text x="60" y="792" font-size="11" fill="#555">→ 9/1 ご指摘「粉末は持っていかれる」への回答</text>

  <rect x="490" y="684" width="420" height="120" rx="8" fill="#fdecea" stroke="#b5402a" stroke-width="1.5"/>
  <text x="510" y="710" font-size="14" font-weight="bold" fill="#111">封じ込め 2：I₂ の色をした液を外に出さない</text>
  <text x="510" y="734" font-size="12" fill="#333">放出（再生）は通水を止めた密閉系で行い、濃縮相は</text>
  <text x="510" y="752" font-size="12" fill="#333">処理水と物理的に分離。処理水側は濁度・UV で常時監視、</text>
  <text x="510" y="770" font-size="12" fill="#333">逸脱時は自動バイパス（本線へは何も入らない）。</text>
  <text x="510" y="792" font-size="11" fill="#555">→ 9/1 ご指摘「I₂ の色をした液が外に出ないように」への回答</text>

  <rect x="940" y="684" width="420" height="120" rx="8" fill="#e8eef7" stroke="#1f5fa8" stroke-width="1.5"/>
  <text x="960" y="710" font-size="14" font-weight="bold" fill="#111">封じ込め 3：本線の取り損ねを増やさない</text>
  <text x="960" y="734" font-size="12" fill="#333">側流は放散塔の「後」から分岐し、既存の回収工程には</text>
  <text x="960" y="752" font-size="12" fill="#333">手を入れない。側流比率 3.5〜6.8% は貴社の実流量に</text>
  <text x="960" y="770" font-size="12" fill="#333">対して再計算する（設計基準 2,074 m³/日は当社側の値）。</text>
  <text x="960" y="792" font-size="11" fill="#555">→ 9/1 ご指摘「取り損ねは絶対にあってはならない」への回答</text>

  <!-- ===== to confirm / sources ===== -->
  <rect x="40" y="826" width="880" height="140" rx="8" fill="#fff4e5" stroke="#d98a1f" stroke-width="1.5"/>
  <text x="60" y="852" font-size="14" font-weight="bold" fill="#7a4e00">〔要確認〕貴社に伺って埋める欄（次回協議）</text>
  <text x="60" y="876" font-size="12" fill="#333">1. 放散塔後 排水の実流量（m³/日）と 集積槽→放散塔→排水 の滞留時間 ── 側流比率と装置サイズが決まる</text>
  <text x="60" y="896" font-size="12" fill="#333">2. 放流先（海域放流 か 還元井）と適用される排水基準・「色」の管理指標 ── 出口ガードの監視項目が決まる</text>
  <text x="60" y="916" font-size="12" fill="#333">3. 排液中のヨウ素の化学形態（I⁻／I₂／IO₃⁻）と亜硫酸分の残留 ── 前処理（酸化）の要否が決まる</text>
  <text x="60" y="936" font-size="12" fill="#333">4. 約 40℃ を賄える低品位熱源（スチームドレン等）の有無と取り出し可否 ── 熱源の設計前提</text>
  <text x="60" y="956" font-size="12" fill="#333">5. 濃縮液を既存吸収工程へ戻す接続の可否（配管・受入条件） ── 「色を出さない」の最終形</text>

  <rect x="940" y="826" width="420" height="140" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1"/>
  <text x="960" y="852" font-size="13" font-weight="bold" fill="#333">数値の出所（当社設計基準・数値台帳 準拠）</text>
  <text x="960" y="874" font-size="11" fill="#444">側流 2,074 m³/日・側流比率 3.5〜6.8%：事業計画書 第1.9版</text>
  <text x="960" y="892" font-size="11" fill="#444">ΔP ≦ 50 kPa・ポリマー流出 ≦ 0.1 wt%：TRL4 判定軸（第⑤・⑥軸）</text>
  <text x="960" y="910" font-size="11" fill="#444">約 40℃・濃縮相 1〜3%・約 10.5 kW：検討資料 §8.1（熱回収率は根拠検証中）</text>
  <text x="960" y="928" font-size="11" fill="#444">回収率・回収量は 9 月末の実液試験で初めて実測（本図に記載しない）</text>
  <text x="960" y="950" font-size="11" fill="#7a4e00">材料の構造・官能基は出願前のため本図に記載しない</text>
</svg>
